<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S - MARK XXXIX CLONE</title>
    <style>
        :root {
            --theme-color: #0ff;
        }
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        
        :root {
            --cyan: #00ffff;
            --dark-cyan: #003333;
            --bg: #010a0f;
            --red: #ff3333;
            --orange: #ff9900;
        }

        body, html {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            background-color: var(--bg);
            color: var(--cyan);
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
            display: grid;
            grid-template-columns: 280px 1fr 320px;
            grid-template-rows: 50px 1fr;
        }

        /* Top Bar */
        .top-bar {
            grid-column: 1 / 4;
            grid-row: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid var(--dark-cyan);
            background: linear-gradient(90deg, rgba(0,255,255,0.05) 0%, transparent 100%);
        }
        .top-bar h1 { font-size: 18px; letter-spacing: 2px; margin: 0; }
        .clock { font-size: 20px; text-align: right; }
        .clock-date { font-size: 10px; color: #888; }

        /* Left Panel - Sys Monitor */
        .left-panel {
            grid-column: 1;
            grid-row: 2;
            border-right: 1px solid var(--dark-cyan);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .panel-header {
            font-size: 12px;
            letter-spacing: 2px;
            border-bottom: 1px solid var(--cyan);
            padding-bottom: 5px;
            margin-bottom: 10px;
        }
        .stat-box { font-size: 12px; }
        .stat-header { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .progress-bg { width: 100%; height: 4px; background: #111; border: 1px solid var(--dark-cyan); }
        .progress-fill { height: 100%; background: var(--cyan); transition: width 0.3s; }
        .progress-fill.danger { background: var(--red); }
        .progress-fill.warn { background: var(--orange); }

        /* Center - Radar HUD */
        .center-panel {
            grid-column: 2;
            grid-row: 2;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, rgba(0,50,50,0.1) 0%, transparent 70%);
        }
        .radar-ring {
            position: absolute;
            border: 1px solid rgba(0, 255, 255, 0.15);
            border-radius: 50%;
        }
        .ring-1 { width: 300px; height: 300px; border-top: 2px solid var(--cyan); animation: spin 4s linear infinite; }
        .ring-2 { width: 450px; height: 450px; border-right: 2px solid var(--cyan); border-left: 2px solid var(--cyan); animation: spin-reverse 8s linear infinite; }
        .ring-3 { width: 600px; height: 600px; border: 1px dashed rgba(0, 255, 255, 0.3); }
        
        .core-status {
            position: absolute;
            bottom: 30px;
            text-align: center;
            width: 100%;
            font-size: 14px;
            letter-spacing: 4px;
            animation: pulse 2s infinite;
        }

        /* Right Panel - Activity Log */
        .right-panel {
            grid-column: 3;
            grid-row: 2;
            border-left: 1px solid var(--dark-cyan);
            padding: 15px;
            display: flex;
            flex-direction: column;
        }
        .activity-log {
            flex-grow: 1;
            overflow-y: auto;
            border: 1px solid var(--dark-cyan);
            background: rgba(0, 10, 15, 0.5);
            padding: 10px;
            font-size: 12px;
            line-height: 1.5;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .log-entry.user { color: #fff; }
        .log-entry.jarvis { color: var(--cyan); }
        .log-entry.system { color: #888; }
        
        /* Input & Controls */
        .command-input {
            width: 100%;
            background: transparent;
            border: 1px solid var(--dark-cyan);
            color: var(--cyan);
            padding: 10px;
            font-family: 'Share Tech Mono', monospace;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        .command-input:focus { outline: none; border-color: var(--cyan); }
        
        .mic-btn {
            width: 100%;
            background: rgba(0, 50, 50, 0.3);
            border: 1px solid var(--cyan);
            color: var(--cyan);
            padding: 12px;
            font-family: 'Share Tech Mono', monospace;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.2s;
        }
        .mic-btn.active {
            background: var(--cyan);
            color: #000;
            box-shadow: 0 0 15px var(--cyan);
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; text-shadow: 0 0 10px var(--cyan); } }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--dark-cyan); }
            .window-controls {
            position: absolute;
            top: 0;
            right: 0;
            display: flex;
            gap: 10px;
            padding: 10px 20px;
            z-index: 9999;
            -webkit-app-region: no-drag;
        }
        .window-controls button {
            background: transparent;
            border: none;
            color: var(--theme-color);
            font-size: 18px;
            cursor: pointer;
            outline: none;
            font-family: monospace;
            opacity: 0.7;
        }
        .window-controls button:hover {
            opacity: 1;
            text-shadow: 0 0 8px var(--theme-color);
        }</style>
</head>
<body>
    <div class="top-bar" style="display:flex; justify-content:space-between; align-items:center;">
        <h1 class="title">J.A.R.V.I.S - MARK XXXIX</h1>
        <div style="display:flex; align-items:center;">            <div class="clock" id="clock">00:00:00</div>
                        <div class="clock-date" id="date">JAN 01 2026</div>
            <button onclick="pywebview.api.toggle_fullscreen()" style="background:transparent; border:none; color:var(--theme-color); font-size:22px; cursor:pointer; font-weight:bold; margin-left:15px;" title="Toggle Fullscreen">☐</button>
                    </div>
    </div>
    <div class="left-panel">
        <div class="panel-header">SYS MONITOR</div>
        
        <div class="stat-box">
            <div class="stat-header"><span>CPU</span><span id="cpu-val">0%</span></div>
            <div class="progress-bg"><div class="progress-fill" id="cpu-bar" style="width: 0%;"></div></div>
        </div>
        
        <div class="stat-box">
            <div class="stat-header"><span>MEM</span><span id="ram-val">0%</span></div>
            <div class="progress-bg"><div class="progress-fill" id="ram-bar" style="width: 0%;"></div></div>
        </div>
        
        <div style="margin-top: auto;">
            <div class="panel-header">AI CORE</div>
            <div style="color: var(--cyan); font-size: 14px; text-align: center; border: 1px solid var(--cyan); padding: 5px;">ACTIVE</div>
        </div>
    </div>

    <div class="center-panel">
        <div class="radar-ring ring-3"></div>
        <div class="radar-ring ring-2"></div>
        <div class="radar-ring ring-1"></div>
        
        <div class="core-status" id="core-status">STANDBY</div>
    </div>

    <div class="right-panel">
        <div class="panel-header">ACTIVITY LOG</div>
        <div class="activity-log" id="log-container">
            <div class="log-entry system">[SYSTEM] J.A.R.V.I.S. Core Initialized.</div>
        </div>
        
        <div class="panel-header">COMMAND INPUT</div>
        <input type="text" class="command-input" placeholder="Type a command..." id="cmd-input">
        <button class="mic-btn active" id="mic-btn">MICROPHONE ACTIVE</button>
    </div>

    <script>
        // Command Input Wiring
        const cmdInput = document.getElementById('cmd-input');
        cmdInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && this.value.trim() !== '') {
                pywebview.api.send_command(this.value.trim());
                this.value = '';
            }
        });

                // Window controls & modes
        document.addEventListener('keydown', (e) => {
            if (e.key === 'F11') {
                pywebview.api.toggle_fullscreen();
                e.preventDefault();
            }
        });
        function switchMode(mode) {
            if (mode === 'FRIDAY') {
                document.documentElement.style.setProperty('--theme-color', '#ff0033');
                document.querySelector('.title').textContent = 'F.R.I.D.A.Y - MARK I';
            } else {
                document.documentElement.style.setProperty('--theme-color', '#0ff');
                document.querySelector('.title').textContent = 'J.A.R.V.I.S - MARK XXXIX';
            }
        }
        // Clock Update
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('en-GB');
            document.getElementById('date').innerText = now.toDateString().toUpperCase();
        }, 1000);

        // API for Python Backend
        function updateTelemetry(cpu, ram) {
            document.getElementById('cpu-val').innerText = cpu + '%';
            const cpuBar = document.getElementById('cpu-bar');
            cpuBar.style.width = cpu + '%';
            cpuBar.className = 'progress-fill ' + (cpu > 80 ? 'danger' : (cpu > 50 ? 'warn' : ''));

            document.getElementById('ram-val').innerText = ram + '%';
            const ramBar = document.getElementById('ram-bar');
            ramBar.style.width = ram + '%';
            ramBar.className = 'progress-fill ' + (ram > 80 ? 'danger' : (ram > 50 ? 'warn' : ''));
        }

        function addLog(speaker, text) {
            const container = document.getElementById('log-container');
            const entry = document.createElement('div');
            entry.className = 'log-entry ' + speaker.toLowerCase();
            entry.innerText = `[${speaker}] ${text}`;
            container.appendChild(entry);
            container.scrollTop = container.scrollHeight;
        }

        function updateState(state) {
            document.getElementById('core-status').innerText = state;
            const micBtn = document.getElementById('mic-btn');
            
            if(state === 'LISTENING') {
                micBtn.innerText = 'MICROPHONE ACTIVE';
                micBtn.classList.add('active');
            } else {
                micBtn.innerText = state;
                micBtn.classList.remove('active');
            }
        }
        
        // Disable parallax override for now in this clean UI
        function updateParallaxFromVision(x, y) {}
        function setGestureMode(mode) {}
    </script>
</body>
</html>
